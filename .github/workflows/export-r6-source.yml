name: Export exact R6 source checkpoint

on:
  push:
    branches:
      - review/stable-readiness-r6-20260922
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-r6-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Archive the exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          archive="bvc-r6-source-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"
          git rev-parse HEAD > SOURCE-COMMIT.txt
          git rev-parse 'HEAD^{tree}' > SOURCE-TREE.txt

      - name: Upload exact source checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bvc-r6-source-${{ github.sha }}
          path: |
            bvc-r6-source-${{ github.sha }}.tar.gz
            bvc-r6-source-${{ github.sha }}.tar.gz.sha256
            SOURCE-COMMIT.txt
            SOURCE-TREE.txt
          if-no-files-found: error
          retention-days: 3
