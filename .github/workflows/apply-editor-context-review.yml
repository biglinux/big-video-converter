name: Apply editor contextual review

on:
  push:
    branches:
      - review/uiux-materialized-r2-20260922
    paths:
      - .github/workflows/apply-editor-context-review.yml

permissions:
  contents: write

concurrency:
  group: apply-editor-context-review
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified editor patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/editor-context-review.patch.xz.b64 \
            | xz -d > /tmp/editor-context-review.patch
          printf '%s  %s\n' \
            'a807030049f4478cfe03083032bb5d653e4ef5fc0a842e60d9c3ffbeeb3f10c8' \
            /tmp/editor-context-review.patch \
            | sha256sum -c -
          git apply --check /tmp/editor-context-review.patch
          git apply /tmp/editor-context-review.patch
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              Path('big-video-converter/usr/share/big-video-converter/ui/video_edit_ui.py'),
              Path('big-video-converter/usr/share/big-video-converter/ui/video_edit_page.py'),
              Path('tools/ui_demo.py'),
              Path('tests/test_video_edit_ui.py'),
          ):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
          git diff --check

      - name: Commit ordinary sources and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Big Video Converter review'
          git config user.email 'review@example.invalid'
          git rm \
            tools/editor-context-review.patch.xz.b64 \
            .github/workflows/apply-editor-context-review.yml \
            .github/workflows/export-editor-review-source.yml
          git add \
            big-video-converter/usr/share/big-video-converter/ui/video_edit_ui.py \
            big-video-converter/usr/share/big-video-converter/ui/video_edit_page.py \
            tools/ui_demo.py \
            tests/test_video_edit_ui.py \
            tests/test_progress_page.py \
            .github/workflows/exact-ui-review-r2.yml \
            .github/workflows/contextual-tests-diagnostic.yml
          git commit -m 'fix(editor): stabilize controls and cleanup'
          git push origin HEAD:review/uiux-materialized-r2-20260922
