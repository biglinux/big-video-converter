name: Build Package

on:
  workflow_dispatch:
  # Only new branches with "testing" or "stable" in the name build a package;
  # `create` has no branch filter, hence the condition below.
  create:

permissions: {}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'branch' &&
      (contains(github.ref_name, 'testing') || contains(github.ref_name, 'stable')))
    runs-on: ubuntu-latest
    steps:
      - name: Send Hooks BigLinux Build Package
        shell: bash
        # Through the environment and jq: a branch name may hold quotes or `$(`.
        env:
          TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          jq -n --arg repo "$REPO" --arg branch "$BRANCH" \
            '{event_type: $repo, client_payload: {branch: $branch, url: "https://github.com/\($repo)"}}' |
            curl --fail-with-body -sS -X POST -H "Accept: application/json" \
              -H "Authorization: token $TOKEN" --data @- \
              https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
