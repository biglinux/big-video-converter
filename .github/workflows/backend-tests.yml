name: Backend and GTK regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      GSK_RENDERER: ngl
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - name: Install test dependencies
        run: |
          if ! { apt-get update && apt-get install -y --no-install-recommends \
            git ca-certificates bash shellcheck ffmpeg python3 python3-pytest \
            python3-gi python3-gi-cairo python3-cairo python3-cairo python3-mpv \
            python3-opengl python3-numpy python3-polib \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91 \
            libmpv2 libgl1-mesa-dri libegl1 xauth xvfb dbus-x11; \
            } > /tmp/bvc-apt.log 2>&1; then
            tail -n 100 /tmp/bvc-apt.log
            exit 1
          fi
          echo 'Dependency installation completed.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell syntax and safety
        run: |
          bash -n big-video-converter/usr/bin/big-video-converter
          shellcheck -S warning big-video-converter/usr/bin/big-video-converter
      - name: Check Python syntax
        run: |
          python3 -m compileall -q big-video-converter/usr/share/big-video-converter tests
      - name: Test real media, cancellation and native GTK
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          chmod 700 "$XDG_RUNTIME_DIR"
          echo 'Installed GSettings schemas:'
          gsettings list-schemas
          xvfb-run -a -s '-screen 0 1440x1000x24' \
            dbus-run-session -- python3 -X faulthandler -m pytest -vv --capture=tee-sys tests --junitxml=results.xml
      - name: Report regression coverage without silently skipped tests
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('results.xml')
          if not report.is_file():
              raise SystemExit('No test report: prerequisite or test execution failed.')
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          counts = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(json.dumps(counts, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### Backend / GTK regression results\n\n```json\n'
                      + json.dumps(counts, indent=2) + '\n```\n')
          if counts['tests'] < 128 or any(counts[k] for k in ('failures', 'errors', 'skipped')):
              raise SystemExit('Expected at least 128 passing regressions with no skipped tests.')
          PY
