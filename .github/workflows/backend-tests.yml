name: Backend and GTK regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      GDK_BACKEND: x11
      # "opengl" is the name GTK 4.18 accepts without a legacy warning; "ngl"
      # is rejected there. The accessibility bus stays enabled on purpose,
      # rather than hiding its D-Bus warning with GTK_A11Y=none.
      GSK_RENDERER: opengl
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - name: Install test dependencies
        run: |
          if ! { apt-get update && apt-get install -y --no-install-recommends \
            git ca-certificates bash shellcheck ffmpeg python3 python3-pytest \
            python3-gi python3-gi-cairo python3-cairo python3-mpv \
            python3-opengl python3-numpy python3-polib \
            gsettings-desktop-schemas at-spi2-core \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91 \
            libmpv2 libgl1-mesa-dri libegl1 xauth xvfb dbus-x11; \
            } > /tmp/bvc-apt.log 2>&1; then
            tail -n 100 /tmp/bvc-apt.log
            exit 1
          fi
          echo 'Dependency installation completed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the tested revision and installed versions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          {
            printf 'Checked-out commit: '; git rev-parse HEAD
            printf 'Checked-out tree: '; git rev-parse 'HEAD^{tree}'
            python3 --version
            python3 -m pytest --version
            ffmpeg -version
            dpkg-query -W
          } 2>&1 | tee ci-versions.log
      - name: Check shell syntax and safety
        run: |
          bash -n big-video-converter/usr/bin/big-video-converter
          shellcheck -S warning big-video-converter/usr/bin/big-video-converter
      - name: Check Python syntax
        run: |
          python3 -m compileall -q big-video-converter/usr/share/big-video-converter tests
      - name: Check native desktop prerequisites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from gi.repository import Gio
          source = Gio.SettingsSchemaSource.get_default()
          schema = source.lookup('org.gnome.desktop.wm.preferences', True) if source is not None else None
          if schema is None or not schema.has_key('button-layout'):
              raise SystemExit('Missing desktop button-layout schema: install gsettings-desktop-schemas.')
          service = Path('/usr/share/dbus-1/services/org.a11y.Bus.service')
          if not service.is_file():
              raise SystemExit('Missing accessibility bus service: install at-spi2-core.')
          print('Desktop schema and accessibility bus service are available.')
          PY
      - name: Test real media, cancellation and native GTK
        id: tests
        run: |
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$XDG_RUNTIME_DIR"' EXIT
          chmod 700 "$XDG_RUNTIME_DIR"
          # Explicit bash uses -eo pipefail: tee cannot turn a test failure green.
          # tee-sys leaves native stderr visible even if GLib terminates Python.
          xvfb-run -a -e /dev/stderr -s '-screen 0 1440x1000x24' \
            dbus-run-session -- python3 -X faulthandler -m pytest \
              -vv --capture=tee-sys tests --junitxml=results.xml 2>&1 | tee pytest.log
      - name: Report regression coverage without silently skipped tests
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('results.xml')
          if not report.is_file():
              raise SystemExit('Tests did not finish: inspect pytest.log and the native diagnostics.')
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          counts = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(json.dumps(counts, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### Backend / GTK regression results\n\n```json\n'
                      + json.dumps(counts, indent=2) + '\n```\n')
          # A skip is the failure worth guarding: the native GTK tests skip
          # silently without a display, which used to make an empty run look
          # green. A fixed expected total only breaks when tests are renamed.
          if not counts['tests'] or any(counts[k] for k in ('failures', 'errors', 'skipped')):
              raise SystemExit('Expected passing regressions with no skipped tests.')
          PY
      - name: Preserve regression diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results.xml
            pytest.log
            ci-versions.log
          retention-days: 14
          if-no-files-found: warn
