name: Verify reviewed backend transfer

on:
  push:
    branches:
      - fix/backend-stability-no-ui-20260907

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reviewed-backend-transfer
  cancel-in-progress: true

jobs:
  transfer:
    if: github.repository == 'biglinux/big-video-converter' && github.ref == 'refs/heads/fix/backend-stability-no-ui-20260907'
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      GSK_RENDERER: ngl
    steps:
      - name: Install isolated runner dependencies
        run: |
          if ! { apt-get update && apt-get install -y --no-install-recommends \
            git ca-certificates bash shellcheck ffmpeg python3 python3-pytest \
            python3-gi python3-gi-cairo python3-cairo python3-mpv \
            python3-opengl python3-numpy python3-polib \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91 \
            libmpv2 libgl1-mesa-dri libegl1 xauth xvfb dbus-x11; \
            } > /tmp/bvc-apt.log 2>&1; then
            tail -n 100 /tmp/bvc-apt.log
            exit 1
          fi
          echo 'Dependency installation completed.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the pinned reviewed source and verify all hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export BVC_REPO="$RUNNER_TEMP/bvc-reviewed-source"
          git worktree add --detach "$BVC_REPO" cc0b6d86ac68fb8f262397816d4c7ad864426580
          git config --global --add safe.directory "$BVC_REPO"
          python3 "$GITHUB_WORKSPACE/.bvc-transfer/transfer.py" prepare
      - name: Check shell and Python before execution
        run: |
          set -eu
          cd "$RUNNER_TEMP/bvc-reviewed-source"
          bash -n big-video-converter/usr/bin/big-video-converter
          shellcheck -S warning big-video-converter/usr/bin/big-video-converter
          python3 -m compileall -q big-video-converter/usr/share/big-video-converter tests
          git diff --cached --check
      - name: Repeat all regression tests with real GTK and FFmpeg
        run: |
          set -eu
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          chmod 700 "$XDG_RUNTIME_DIR"
          cd "$RUNNER_TEMP/bvc-reviewed-source"
          xvfb-run -a -s '-screen 0 1440x1000x24' \
            dbus-run-session -- python3 -m pytest -q tests --junitxml=results.xml
      - name: Publish only the verified final tree to this review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          export BVC_REPO="$RUNNER_TEMP/bvc-reviewed-source"
          python3 "$GITHUB_WORKSPACE/.bvc-transfer/transfer.py" publish
