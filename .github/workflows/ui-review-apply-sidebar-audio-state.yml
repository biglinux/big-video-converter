name: UI review — preserve audio-cleaning preferences

on:
  push:
    branches:
      - review/uiux-libadwaita194-r2-20260922
    paths:
      - .github/ui-review/apply-sidebar-audio-state.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/uiux-libadwaita194-r2-20260922
          fetch-depth: 0

      - name: Apply focused sidebar correction
        run: python3 .github/ui-review/apply-sidebar-audio-state.py

      - name: Validate correction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            big-video-converter/usr/share/big-video-converter/sidebar_builder.py \
            tests/test_audio_ui_state.py
          python3 -m pytest -q tests/test_audio_ui_state.py
          git diff --check
          git diff --exit-code --quiet && {
            echo 'Expected sidebar change was not produced' >&2
            exit 1
          }

      - name: Commit focused correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            big-video-converter/usr/share/big-video-converter/sidebar_builder.py \
            tests/test_audio_ui_state.py
          git commit -m 'fix(ui): preserve saved audio-cleaning preferences'
          git push origin HEAD:review/uiux-libadwaita194-r2-20260922
