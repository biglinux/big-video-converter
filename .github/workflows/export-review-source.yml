name: Export review source

on:
  push:
    branches:
      - review/dev-talesam-20260919
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-review-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create exact tracked-source archive
        run: |
          git archive --format=tar.gz --prefix=big-video-converter/ \
            --output=big-video-converter-review-source.tar.gz HEAD
          git rev-parse HEAD > SOURCE_COMMIT
          sha256sum big-video-converter-review-source.tar.gz > SHA256SUMS
      - name: Upload review source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: big-video-converter-review-source-${{ github.sha }}
          path: |
            big-video-converter-review-source.tar.gz
            SOURCE_COMMIT
            SHA256SUMS
          retention-days: 1
          if-no-files-found: error
