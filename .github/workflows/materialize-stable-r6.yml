name: Materialize verified R6 release hardening

on:
  push:
    branches:
      - review/stable-readiness-r6-20260922
    paths:
      - .review/RUN-R6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-stable-r6
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reconstruct, verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .review/RUN-R6
          sha256sum -c <<'SUMS'
          515f128702862da461aaf98a1fa28e344e72655fda458651c5ea519d89425d72  .review/r6.part.00
          5e374d7ea4da39b81a895e22e445052bd13568c0951ed87738071b36f92ea04d  .review/r6.part.01
          131c95a704c80c09fd32a481b666692fe0c6e407b7235680914a4d44bed34882  .review/r6.part.02
          c89656799d190bcc3ef91141e33a8d81924f51271f8d5d6c62dcffdf81b240bb  .review/r6.part.03
          2bb757d3ae9dd9bac2340143dddeeb52a68d50028001e0d5717a31d76856311d  .review/r6.part.04
          732581bb68d8d2af1424149ecf3cef8cc09184f4cc0d72a999785e739e5c4d56  .review/r6.part.05
          SUMS
          cat .review/r6.part.* | tr -d '\r\n' | base64 --decode > /tmp/BVC-STABLE-READINESS-R6.diff.gz
          echo '77d9be0f831fe86c1bc39527f784ae53d7bcfad8e15f1f82d0fa170991010b2c  /tmp/BVC-STABLE-READINESS-R6.diff.gz' | sha256sum -c -
          gzip -dc /tmp/BVC-STABLE-READINESS-R6.diff.gz > /tmp/BVC-STABLE-READINESS-R6.diff
          echo '5db51e1de29df9153c7e40f3e1bb71d8918f14bb1a794fe93c7646c856344ca2  /tmp/BVC-STABLE-READINESS-R6.diff' | sha256sum -c -
          git apply --check /tmp/BVC-STABLE-READINESS-R6.diff
          git apply /tmp/BVC-STABLE-READINESS-R6.diff

          # A workflow token cannot publish workflow-file changes. Restore all
          # workflows here; the authorized connector applies them atomically
          # after this source-only commit lands.
          git checkout -- \
            .github/workflows/backend-tests.yml \
            .github/workflows/build-package.yml \
            .github/workflows/export-r6-source.yml \
            .github/workflows/materialize-stable-r6.yml
          rm -f .review/r6.part.* .review/RUN-R6
          rmdir .review
          git diff --check

      - name: Run transport-independent checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q \
            big-video-converter/usr/share/big-video-converter \
            tests
          bash -n big-video-converter/usr/bin/big-video-converter
          bash -n big-video-converter/usr/bin/big-video-converter-gui
          bash -n tools/update-translations.sh
          bash -n tools/compile-translations.sh
          bash -n pkgbuild/PKGBUILD
          python3 - <<'PY'
          import importlib.util
          import xml.etree.ElementTree as ET
          from pathlib import Path

          test_path = Path('tests/test_release_metadata.py')
          spec = importlib.util.spec_from_file_location('release_metadata', test_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = sorted(
              (name, value) for name, value in vars(module).items()
              if name.startswith('test_') and callable(value)
          )
          for name, test in tests:
              test()
              print(f'PASS {name}')
          if len(tests) != 8:
              raise SystemExit(f'Expected 8 release tests, ran {len(tests)}')

          metadata = Path(
              'big-video-converter/usr/share/metainfo/'
              'br.com.biglinux.converter.metainfo.xml'
          )
          component = ET.parse(metadata).getroot()
          assert component.findtext('id') == 'br.com.biglinux.converter'
          assert component.findtext('project_license') == 'MIT'
          PY

      - name: Commit the source-only reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigLinux Review Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to push workflow changes with the workflow token.' >&2
            exit 1
          fi
          git commit -m 'fix(release): harden packaging metadata and launch path'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
